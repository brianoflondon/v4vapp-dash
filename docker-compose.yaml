# Self-contained API. No host ports — callers use Docker DNS on v4vapp-dash:8080.
# Local docs/debug: docker compose -f docker-compose.yaml -f docker-compose.regtest.yaml up
# Join the backend stack: docker compose -f docker-compose.yaml -f docker-compose.backend-net.yaml up

services:
  v4vapp-dash:
    build: .
    container_name: v4vapp-dash
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "v4vapp_dash"]
    environment:
      DASH_BIND: 0.0.0.0
      DASH_PORT: "8080"
      # DASH_CONFIG: sample.config.yaml   # only with the optional mount below
    volumes:
      - ./logs:/app/logs
      # optional, after: cp tests/data/config/sample.config.yaml config/sample.config.yaml
      # - ./config/sample.config.yaml:/app/config/sample.config.yaml:ro
    networks:
      - v4vapp-dash
    restart: on-failure:3
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  v4vapp-dash:
    driver: bridge
