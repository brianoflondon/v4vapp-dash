name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync
        run: uv sync --dev --frozen

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Secret scan
        run: |
          set -euo pipefail
          # Do not grep this workflow: the patterns themselves contain DASH_MNEMONIC=.
          EXCLUDES=(
            ':!example.env'
            ':!**/.env.example'
            ':!docs/**'
            ':!.github/workflows/**'
          )
          if git grep -nIE '^[[:space:]]*DASH_MNEMONIC=[^[:space:]#]+' -- "${EXCLUDES[@]}" ; then
            echo "Possible mnemonic in tree" >&2
            exit 1
          fi
          if git grep -nIE '^[[:space:]]*DASH_XPRV=[^[:space:]#]+' -- "${EXCLUDES[@]}" ; then
            echo "Possible xprv in tree" >&2
            exit 1
          fi
          if git grep -nIE '^[[:space:]]*DASH_XPUB=xpub[A-Za-z0-9]+' -- "${EXCLUDES[@]}" ; then
            echo "Possible raw xpub assignment in tree" >&2
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$|\.xprv$|\.xpub$' ; then
            echo "Secret filename staged" >&2
            exit 1
          fi
          # Plaintext secret keys in committed YAML. Do not match *_env_var / *_file.
          if git grep -nIE '^[[:space:]]*(api_key|rpc_password|password|xpub|mnemonic|mongo_uri)[[:space:]]*:' -- '*.yaml' '*.yml' ':!docs/**' ':!.github/workflows/**' ; then
            echo "Possible plaintext secret assignment in YAML" >&2
            exit 1
          fi
          if git grep -nIE 'mongodb://[^:]+:[^@]+@' -- '*.yaml' '*.yml' ':!docs/**' ':!.github/workflows/**' ; then
            echo "Possible Mongo URI with credentials in YAML" >&2
            exit 1
          fi
